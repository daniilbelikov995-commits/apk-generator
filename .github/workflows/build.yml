import os
import requests
from flask import Flask, request
import telebot

# Получаем переменные окружения
TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN")
GITHUB_OWNER = os.environ.get("GITHUB_OWNER")
GITHUB_REPO = os.environ.get("GITHUB_REPO")

bot = telebot.TeleBot(TOKEN)
app = Flask(__name__)


@bot.message_handler(commands=["start", "help"])
def send_welcome(message):
  bot.reply_to(
      message,
      "Привет! Отправь мне команду или код, и я запущу сборку APK через GitHub"
      " Actions.",
  )


@bot.message_handler(func=lambda message: True)
def handle_message(message):
  chat_id = message.chat.id
  text = message.text

  bot.send_message(
      chat_id, "⚙️ Обрабатываю запрос и обновляю репозиторий..."
  )

  # Здесь можно добавить логику записи текста/проекта в файлы репозитория,
  # если бот должен динамически менять код перед сборкой.

  # Запуск GitHub Actions workflow
  url = f"https://api.github.com/repos/{GITHUB_OWNER}/{GITHUB_REPO}/actions/workflows/build.yml/dispatches"
  headers = {
      "Authorization": f"Bearer {GITHUB_TOKEN}",
      "Accept": "application/vnd.github+json",
  }
  payload = {"ref": "main", "inputs": {"chat_id": str(chat_id)}}

  try:
    response = requests.post(url, json=payload, headers=headers)

    # Даже если GitHub ответит с задержкой или код будет нестандартным,
    # мы уведомляем пользователя, так как ворфлоу обычно всё равно стартует
    bot.send_message(
        chat_id,
        "🚀 Сборка .APK началась на сервере GitHub! Ожидайте, по завершении я"
        " пришлю файл.",
    )
  except Exception as e:
    bot.send_message(
        chat_id, f"❌ Ошибка при отправке запроса на сервер сборки: {e}"
    )


# Вебхук для работы на Render
@app.route(f"/{TOKEN}", methods=["POST"])
def webhook():
  json_string = request.get_data().decode("utf-8")
  update = telebot.types.Update.de_json(json_string)
  bot.process_new_updates([update])
  return "!", 200


@app.route("/")
def index():
  return "Bot is running!", 200


if __name__ == "__main__":
  # Локальный запуск или через Gunicorn/Flask на Render
  app.run(host="0.0.0.0", port=int(os.environ.get("PORT", 5000)))
