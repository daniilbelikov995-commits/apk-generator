name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram Chat ID to send the APK back'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            libncurses5-dev \
            libstdc++6 \
            libglew-dev \
            libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade cython==0.29.36 buildozer

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Find and Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          APK_FILE=$(ls bin/*.apk | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Sending $APK_FILE to Telegram chat $CHAT_ID..."
            curl -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_FILE" \
                 -F caption="✅ APK успешно собран и готов!" \
                 https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument
          else
            echo "Error: APK file not found!"
            exit 1
          fi
